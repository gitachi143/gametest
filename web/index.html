<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NEXUS ARCADE — chat games with a mind of their own</title>
<meta name="description" content="Seven chat-based games played against a language model: crack a vault by talking, run an interrogation, bluff a table of AI players, win a debate. One arcade, one run at a time.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/games.css">
</head>
<body>
<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <button class="brand" id="brand" aria-label="Nexus Arcade home">
    <span class="brand-mark">◈</span>
    <span class="brand-text">NEXUS<em>ARCADE</em></span>
  </button>

  <div class="topbar-right">
    <div class="level-chip" id="level-chip" role="button" tabindex="0" aria-label="Open profile">
      <div class="level-ring"><span id="level-num">1</span></div>
      <div class="level-meta">
        <span class="level-title" id="level-title">Bystander</span>
        <div class="xp-track"><i id="xp-fill" style="width:0%"></i></div>
      </div>
    </div>
    <button class="chip streak-chip" id="streak-chip" title="Daily streak">🔥<span id="streak-num">0</span></button>
    <button class="chip" id="btn-leaderboard" title="Leaderboards">🏆</button>
    <button class="chip" id="btn-sound" title="Toggle sound" aria-pressed="true">🔊</button>
  </div>
</header>

<main id="view" class="view"></main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<template id="tpl-home">
  <section class="home">
    <div class="hero">
      <div class="hero-copy">
        <h1>Seven games.<br>One opponent that <em>talks back</em>.</h1>
        <p>Talk a vault open. Run a murder interrogation. Bluff a table that is reading you.
           Every game here is a conversation you are trying to win.</p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="hero-daily">
            <span class="btn-icon">📅</span> Play today's challenge
          </button>
          <button class="btn btn-ghost" id="hero-random">Surprise me</button>
        </div>
        <div class="hero-meta" id="hero-meta"></div>
      </div>
      <div class="hero-daily" id="daily-card"></div>
    </div>

    <div class="section-head">
      <h2>The floor</h2>
      <span class="hint">7 games · pick your poison</span>
    </div>
    <div class="game-grid" id="game-grid"></div>

    <div class="home-columns">
      <section class="panel" id="ach-panel">
        <div class="panel-head"><h3>Achievements</h3><span id="ach-count" class="hint"></span></div>
        <div class="ach-strip" id="ach-strip"></div>
      </section>
      <section class="panel" id="recent-panel">
        <div class="panel-head"><h3>Your last runs</h3></div>
        <div class="recent-list" id="recent-list"></div>
      </section>
    </div>
  </section>
</template>

<template id="tpl-game">
  <section class="game-view">
    <div class="game-head">
      <button class="btn-icon-only" id="game-back" aria-label="Back to arcade">←</button>
      <div class="game-id">
        <span class="game-icon" id="game-icon"></span>
        <div>
          <h2 id="game-title"></h2>
          <span class="game-mode" id="game-mode"></span>
        </div>
      </div>
      <div class="game-head-right">
        <div class="stat-strip" id="stat-strip"></div>
        <button class="btn-icon-only" id="game-help" aria-label="How to play">?</button>
      </div>
    </div>

    <div class="game-body">
      <div class="chat-col">
        <div class="chat" id="chat" role="log" aria-live="polite"></div>
        <div class="composer" id="composer"></div>
      </div>
      <aside class="hud" id="hud"></aside>
    </div>
  </section>
</template>

<script type="module" src="/static/js/app.js"></script>
<noscript><p style="padding:2rem;color:#eee">Nexus Arcade needs JavaScript.</p></noscript>
</body>
</html>
